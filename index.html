<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인터벌">
<meta name="theme-color" content="#0B0E11">
<title>인터벌 타이머</title>
<style>
  :root{
    --bg:#0B0E11;
    --panel:#14181D;
    --line:#242A31;
    --text:#F2F4F5;
    --muted:#7A8592;
    --ready:#5B7A99;
    --sprint:#FF5A36;
    --walk:#33D6A6;
    --done:#FFD166;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    user-select:none;
    transition:background-color .25s ease;
  }
  .eyebrow{
    text-align:center;
    letter-spacing:.18em;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    margin-top:22px;
  }
  .stage{
    flex:1;
    min-height:0;   /* 없으면 링 크기 아래로 줄지 않아 아래 요소가 잘린다 */
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:8px 0;
  }
  .phase-label{
    font-size:15px;
    font-weight:700;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--muted);
  }
  /* 설정 항목이 5줄이라 높이가 빠듯하다. vh를 함께 걸어 작은 화면에서 링이 먼저 줄게 한다. */
  .ring-wrap{ position:relative; flex:none; width:min(66vw,300px,34vh); height:min(66vw,300px,34vh); }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--line); stroke-width:10; }
  .ring-fg{ fill:none; stroke:var(--sprint); stroke-width:10; stroke-linecap:round; transition:stroke .2s ease; }
  .ring-center{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;
    font-size:min(15vw,68px);
    font-weight:600;
  }
  .round-label{ font-size:13px; color:var(--muted); font-weight:600; }

  .config{
    display:flex; flex-direction:column; gap:14px;
    padding:0 24px; width:100%; max-width:360px; margin:0 auto;
  }
  .field{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:12px 16px;
  }
  .field label{ font-size:14px; color:var(--muted); }
  .field input{
    width:64px; text-align:right;
    background:transparent; border:none; outline:none;
    color:var(--text); font-size:20px; font-weight:600;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;
  }
  .field input[type="checkbox"]{
    width:24px; height:24px; margin:0;
    accent-color:var(--sprint);
  }

  .controls{
    display:flex; gap:12px; justify-content:center;
    padding:20px 24px 10px;
  }
  button{
    border:none; border-radius:16px;
    font-size:16px; font-weight:700;
    padding:16px 0; flex:1; max-width:220px;
    font-family:inherit; cursor:pointer;
  }
  .btn-primary{ background:var(--text); color:#0B0E11; }
  .btn-primary:disabled{ opacity:.5; }
  .btn-ghost{ background:var(--panel); color:var(--text); border:1px solid var(--line); }
  .btn-secondary{ background:var(--line); color:var(--text); }

  .hint{
    text-align:center; color:var(--muted); font-size:12px;
    padding:0 32px 18px; line-height:1.5;
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>

  <div class="eyebrow" id="eyebrow">인터벌 타이머</div>

  <div class="stage">
    <div class="phase-label" id="phaseLabel">설정</div>
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fg" id="ring" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
      </svg>
      <div class="ring-center" id="clock">00:00</div>
    </div>
    <div class="round-label" id="roundLabel">&nbsp;</div>
  </div>

  <div class="config" id="config">
    <div class="field"><label>전력질주 (초)</label><input id="cfgSprint" type="number" min="1" value="20"></div>
    <div class="field"><label>걷기/회복 (초)</label><input id="cfgWalk" type="number" min="1" value="10"></div>
    <div class="field"><label>라운드 수</label><input id="cfgRounds" type="number" min="1" value="8"></div>
    <div class="field"><label>시작 카운트다운 (초)</label><input id="cfgCountdown" type="number" min="0" value="5"></div>
    <div class="field"><label>질주 중 1초 카운트음</label><input id="cfgSprintTick" type="checkbox" checked></div>
  </div>

  <div class="controls" id="controlsIdle">
    <button class="btn-primary" id="btnStart">시작</button>
  </div>
  <div class="controls hidden" id="controlsRun">
    <button class="btn-ghost" id="btnPause">일시정지</button>
    <button class="btn-secondary" id="btnReset">종료</button>
  </div>

  <div class="hint">화면을 꺼도 소리는 계속 재생됩니다. Safari 공유 버튼 → “홈 화면에 추가”로 저장하면 앱처럼 쓸 수 있습니다.</div>

  <audio id="player" preload="auto" playsinline></audio>

<script>
(function(){
  'use strict';

  /* ---------- DOM ---------- */
  const els = {
    phaseLabel: document.getElementById('phaseLabel'),
    ring: document.getElementById('ring'),
    clock: document.getElementById('clock'),
    roundLabel: document.getElementById('roundLabel'),
    config: document.getElementById('config'),
    controlsIdle: document.getElementById('controlsIdle'),
    controlsRun: document.getElementById('controlsRun'),
    btnStart: document.getElementById('btnStart'),
    btnPause: document.getElementById('btnPause'),
    btnReset: document.getElementById('btnReset'),
    cfgSprint: document.getElementById('cfgSprint'),
    cfgWalk: document.getElementById('cfgWalk'),
    cfgRounds: document.getElementById('cfgRounds'),
    cfgCountdown: document.getElementById('cfgCountdown'),
    cfgSprintTick: document.getElementById('cfgSprintTick'),
  };
  const player = document.getElementById('player');

  const RING_CIRC = 2 * Math.PI * 52;
  const COLORS = { ready:'#5B7A99', sprint:'#FF5A36', walk:'#33D6A6', done:'#FFD166' };
  const PHASE_TEXT = { ready:'준비', sprint:'전력질주', walk:'걷기 / 회복', done:'완료' };
  // 비프음 최고 배음이 4400Hz라 22050Hz면 충분하고, 블롭 크기가 절반으로 줄어든다.
  const SAMPLE_RATE = 22050;

  /* ---------- 상태 ----------
     화면 전환과 이벤트 처리는 전부 이 값 하나만 보고 결정한다.
     PREPARING 중에는 무음 프라이머가 재생되는데, 여기서 오는
     ended/pause 이벤트를 세션 종료로 오해하면 안 된다. */
  const IDLE='idle', PREPARING='preparing', RUNNING='running', PAUSED='paused', DONE='done';
  let state = IDLE;
  let plan = null;
  let rafId = 0;
  let trackUrl = null;
  let primerUrl = null;

  /* ---------- 설정 ---------- */
  function readConfig(){
    const int = (el, fallback, min) => {
      const v = parseInt(el.value, 10);
      return Math.max(min, isNaN(v) ? fallback : v);
    };
    return {
      sprint: int(els.cfgSprint, 20, 1),
      walk: int(els.cfgWalk, 10, 1),
      rounds: int(els.cfgRounds, 8, 1),
      countdown: int(els.cfgCountdown, 5, 0),
      sprintTick: els.cfgSprintTick.checked,
    };
  }

  /* ---------- 세션 구성 ---------- */
  function buildPlan(cfg){
    const segments = [];
    let t = 0;
    segments.push({start:0, end:cfg.countdown, phase:'ready', round:0});
    t = cfg.countdown;
    for(let r=1; r<=cfg.rounds; r++){
      segments.push({start:t, end:t+cfg.sprint, phase:'sprint', round:r});
      t += cfg.sprint;
      segments.push({start:t, end:t+cfg.walk, phase:'walk', round:r});
      t += cfg.walk;
    }
    const total = t;
    segments.push({start:t, end:t+1.2, phase:'done', round:cfg.rounds});

    const beeps = [];
    // 카운트다운 전 구간에서 1초마다.
    for(let k=0; k<cfg.countdown; k++) beeps.push({t:k, type:'tick'});
    segments.forEach(seg=>{
      if(seg.phase==='sprint'){
        beeps.push({t:seg.start, type:'sprint_start'});
        // 질주 중 1초 카운트음. 시작과 끝은 전환음이 이미 울리므로 사이 초에만.
        if(cfg.sprintTick){
          for(let k=1; k < seg.end-seg.start; k++) beeps.push({t:seg.start+k, type:'tick'});
        }
      }
      else if(seg.phase==='walk') beeps.push({t:seg.start, type:'walk_start'});
      else if(seg.phase==='done') beeps.push({t:seg.start, type:'done'});
    });
    return {segments, beeps, total, rounds:cfg.rounds};
  }

  /* ---------- 오디오 생성 ---------- */
  async function renderTrack(p){
    const ctx = new OfflineAudioContext(1, Math.ceil((p.total+1.5)*SAMPLE_RATE), SAMPLE_RATE);
    // 홀수 배음(사각파에 가까운 음색)이 같은 피크에서 가장 크게 들리고
    // 바람·차 소리를 잘 뚫는다. 배음끼리 위상이 어긋나 합이 1.46이어도
    // 실제 피크는 0.95 근처라 클리핑되지 않는다.
    const PURE = [[1,1]];
    const RICH = [[1,0.5],[3,0.3],[5,0.2]];
    function beep(time, freq, dur, peak, partials){
      partials.forEach(([mult, rel])=>{
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = freq * mult;
        const g = ctx.createGain();
        const amp = peak * rel;
        g.gain.setValueAtTime(0, time);
        g.gain.linearRampToValueAtTime(amp, time+0.005);
        g.gain.setValueAtTime(amp, time+dur*0.75);
        g.gain.linearRampToValueAtTime(0, time+dur);
        osc.connect(g).connect(ctx.destination);
        osc.start(time);
        osc.stop(time+dur+0.02);
      });
    }
    p.beeps.forEach(e=>{
      if(e.type==='tick') beep(e.t, 660, 0.08, 0.45, PURE);
      else if(e.type==='sprint_start'){ beep(e.t,880,0.14,1.42,RICH); beep(e.t+0.18,880,0.14,1.42,RICH); }
      else if(e.type==='walk_start'){ beep(e.t,440,0.26,1.42,RICH); }
      else if(e.type==='done'){ beep(e.t,523,0.15,1.30,RICH); beep(e.t+0.18,659,0.15,1.30,RICH); beep(e.t+0.36,784,0.22,1.30,RICH); }
    });
    return ctx.startRendering();
  }

  // iOS는 백그라운드에서 WebAudio를 정지시키므로 렌더링 결과를
  // <audio> 엘리먼트가 재생할 수 있는 16bit PCM WAV 파일로 바꾼다.
  function encodeWav(samples, sampleRate){
    const dataSize = samples.length * 2;
    const buf = new ArrayBuffer(44 + dataSize);
    const view = new DataView(buf);
    let o = 0;
    const str = s => { for(let i=0;i<s.length;i++) view.setUint8(o++, s.charCodeAt(i)); };
    const u32 = v => { view.setUint32(o, v, true); o += 4; };
    const u16 = v => { view.setUint16(o, v, true); o += 2; };
    str('RIFF'); u32(36 + dataSize); str('WAVE');
    str('fmt '); u32(16); u16(1); u16(1);
    u32(sampleRate); u32(sampleRate*2); u16(2); u16(16);
    str('data'); u32(dataSize);
    for(let i=0;i<samples.length;i++){
      const s = Math.max(-1, Math.min(1, samples[i]));
      view.setInt16(o, s < 0 ? s*0x8000 : s*0x7FFF, true);
      o += 2;
    }
    return URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
  }

  /* ---------- 화면 ---------- */
  // 표시할 화면은 상태에서만 결정한다. 개별 핸들러가 각자 토글하지 않는다.
  function renderScreen(){
    const idleScreen = (state===IDLE || state===DONE);
    els.config.classList.toggle('hidden', !idleScreen);
    els.controlsIdle.classList.toggle('hidden', !idleScreen);
    els.controlsRun.classList.toggle('hidden', idleScreen);
    els.btnStart.disabled = (state===PREPARING);
    els.btnPause.textContent = (state===PAUSED) ? '이어서' : '일시정지';
  }

  function findSegment(elapsed){
    for(const s of plan.segments){ if(elapsed>=s.start && elapsed<s.end) return s; }
    return plan.segments[plan.segments.length-1];
  }

  function renderClock(elapsed){
    if(!plan) return;
    const seg = findSegment(elapsed);
    const remain = Math.max(0, Math.ceil(seg.end - elapsed));
    els.clock.textContent =
      String(Math.floor(remain/60)).padStart(2,'0') + ':' + String(remain%60).padStart(2,'0');
    els.phaseLabel.textContent = PHASE_TEXT[seg.phase];
    els.phaseLabel.style.color = COLORS[seg.phase];
    els.ring.style.stroke = COLORS[seg.phase];
    els.roundLabel.textContent =
      seg.phase==='ready' ? '곧 시작합니다' :
      seg.phase==='done'  ? '수고하셨습니다' :
      seg.round + ' / ' + plan.rounds;

    const segDur = Math.max(0.001, seg.end - seg.start);
    const progress = Math.min(1, Math.max(0, (elapsed - seg.start)/segDur));
    els.ring.setAttribute('stroke-dasharray', RING_CIRC);
    els.ring.setAttribute('stroke-dashoffset', RING_CIRC * (1-progress));
  }

  function clearClock(){
    els.phaseLabel.textContent = '설정';
    els.phaseLabel.style.color = '';
    els.roundLabel.textContent = ' ';
    els.clock.textContent = '00:00';
    els.ring.setAttribute('stroke-dashoffset', RING_CIRC);
  }

  /* ---------- 진행 표시 ----------
     화면은 오디오 자체의 재생 위치를 따라간다. 잠금 해제 후에도 소리와 어긋나지 않는다. */
  function elapsed(){ return player.currentTime; }

  function frame(){
    renderClock(elapsed());
    rafId = (state===RUNNING) ? requestAnimationFrame(frame) : 0;
  }
  function startTicking(){ cancelAnimationFrame(rafId); rafId = requestAnimationFrame(frame); }
  function stopTicking(){ cancelAnimationFrame(rafId); rafId = 0; }

  /* ---------- 리소스 ---------- */
  function revoke(url){ if(url) URL.revokeObjectURL(url); }

  function silentPrimerUrl(){
    return encodeWav(new Float32Array(Math.round(SAMPLE_RATE*0.25)), SAMPLE_RATE);
  }

  function setupMediaSession(){
    if(!('mediaSession' in navigator)) return;
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title:'인터벌 타이머', artist: plan.rounds + ' 라운드',
      });
      navigator.mediaSession.setActionHandler('pause', pause);
      navigator.mediaSession.setActionHandler('play', resume);
    }catch(e){/* 지원 안 하면 무시 */}
  }

  /* ---------- 전환 ---------- */
  async function start(){
    if(state!==IDLE && state!==DONE) return;
    plan = buildPlan(readConfig());
    state = PREPARING;
    renderScreen();
    els.phaseLabel.textContent = '준비 중...';

    // iOS는 탭 제스처 안에서 동기적으로 play()가 호출된 엘리먼트만 잠금 해제한다.
    // await 이전에 무음으로 먼저 해제해 둔다. loop을 켜야 프라이머가 끝나면서
    // ended를 쏘지 않는다.
    revoke(primerUrl);
    primerUrl = silentPrimerUrl();
    player.loop = true;
    player.src = primerUrl;
    player.play().catch(()=>{});

    let url;
    try{
      const buffer = await renderTrack(plan);
      url = encodeWav(buffer.getChannelData(0), buffer.sampleRate);
    }catch(e){
      return fail('오디오 생성 실패');
    }
    if(state!==PREPARING){ revoke(url); return; }  // 준비 중 종료를 눌렀다면 버린다

    revoke(trackUrl);
    trackUrl = url;
    player.loop = false;
    player.src = trackUrl;
    try{
      await player.play();
    }catch(e){
      return fail('재생을 시작할 수 없습니다');
    }
    if(state!==PREPARING){ return; }

    state = RUNNING;
    renderScreen();
    setupMediaSession();
    startTicking();
  }

  function fail(message){
    state = IDLE;
    stopTicking();
    renderScreen();
    els.phaseLabel.textContent = message;
  }

  function pause(){
    if(state!==RUNNING) return;
    state = PAUSED;
    player.pause();
    stopTicking();
    renderScreen();
  }

  function resume(){
    if(state!==PAUSED) return;
    state = RUNNING;
    player.play().catch(()=>{ pause(); });
    renderScreen();
    startTicking();
  }

  function finish(){
    state = DONE;
    stopTicking();
    renderClock(plan.total + 1);
    renderScreen();
  }

  function reset(){
    state = IDLE;
    stopTicking();
    player.pause();
    player.loop = false;
    player.removeAttribute('src');
    player.load();
    revoke(trackUrl); trackUrl = null;
    revoke(primerUrl); primerUrl = null;
    plan = null;
    clearClock();
    renderScreen();
  }

  /* ---------- 이벤트 ----------
     전부 상태로 가드한다. PREPARING 중 프라이머가 내는 이벤트는 무시된다. */
  els.btnStart.addEventListener('click', start);
  els.btnPause.addEventListener('click', ()=>{ state===PAUSED ? resume() : pause(); });
  els.btnReset.addEventListener('click', reset);

  player.addEventListener('ended', ()=>{ if(state===RUNNING) finish(); });

  // 전화 수신 등으로 시스템이 멈춘 경우에도 화면을 맞춘다.
  player.addEventListener('pause', ()=>{
    if(state===RUNNING && !player.ended) pause();
  });

  // 잠금 해제 후 rAF는 멈춰 있으므로 화면을 즉시 재생 위치에 맞춘다.
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState!=='visible') return;
    if(state===RUNNING){ renderClock(elapsed()); startTicking(); }
  });

  renderScreen();
})();
</script>
</body>
</html>
