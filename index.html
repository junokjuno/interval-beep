<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인터벌">
<meta name="theme-color" content="#0B0E11">
<title>인터벌 타이머</title>
<!-- 빌드 도구가 없어 파일명에 해시를 못 붙인다. 배포할 때 v 값을 올려야
     새 CSS/JS가 확실히 내려간다. 안 올리면 홈 화면 PWA가 옛 파일을 계속 쓴다. -->
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <div class="tabs" id="tabs">
    <button class="tab is-active" data-mode="two">2단계</button>
    <button class="tab" data-mode="three">3단계</button>
  </div>

  <div class="stage">
    <div class="phase-label" id="phaseLabel">설정</div>
    <div class="ring-wrap" id="ringWrap">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fg" id="ring" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
      </svg>
      <div class="ring-center" id="clock">00:00</div>
    </div>
    <div class="round-label" id="roundLabel">&nbsp;</div>
  </div>

  <div class="config" id="config">
    <div class="field" data-phase-field="sprint">
      <label><i class="dot dot-sprint"></i>전력질주 (초)</label>
      <input id="cfgSprint" type="number" min="1" value="20">
    </div>
    <div class="field" data-phase-field="walk">
      <label><i class="dot dot-walk"></i>걷기 / 회복 (초)</label>
      <input id="cfgWalk" type="number" min="1" value="10">
    </div>
    <div class="field" data-phase-field="steps">
      <label><i class="dot dot-steps"></i>잔발 스텝 (초)</label>
      <input id="cfgSteps" type="number" min="1" value="15">
    </div>
    <div class="field" data-phase-field="rest">
      <label><i class="dot dot-walk"></i>휴식 (초)</label>
      <input id="cfgRest" type="number" min="1" value="30">
    </div>
    <div class="field"><label>라운드 수</label><input id="cfgRounds" type="number" min="1" value="8"></div>
    <div class="field"><label>시작 카운트다운 (초)</label><input id="cfgCountdown" type="number" min="0" value="5"></div>
    <div class="field"><label>질주 중 1초 카운트음</label><input id="cfgSprintTick" type="checkbox" checked></div>
  </div>

  <div class="controls" id="controlsIdle">
    <button class="btn-primary" id="btnStart">시작</button>
  </div>
  <div class="controls hidden" id="controlsRun">
    <button class="btn-ghost" id="btnPause">일시정지</button>
    <button class="btn-secondary" id="btnReset">종료</button>
  </div>

  <div class="hint" id="hint">화면을 꺼도 소리는 계속 재생됩니다. Safari 공유 버튼 → “홈 화면에 추가”로 저장하면 앱처럼 쓸 수 있습니다.</div>

  <audio id="player" preload="auto" playsinline></audio>

<script src="app.js?v=2" defer></script>
</body>
</html>
