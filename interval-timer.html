<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="인터벌">
<meta name="theme-color" content="#0B0E11">
<title>인터벌 타이머</title>
<style>
  :root{
    --bg:#0B0E11;
    --panel:#14181D;
    --line:#242A31;
    --text:#F2F4F5;
    --muted:#7A8592;
    --ready:#5B7A99;
    --sprint:#FF5A36;
    --walk:#33D6A6;
    --done:#FFD166;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow:hidden;
    user-select:none;
    transition:background-color .25s ease;
  }
  .eyebrow{
    text-align:center;
    letter-spacing:.18em;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    margin-top:22px;
  }
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
  }
  .phase-label{
    font-size:15px;
    font-weight:700;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .ring-wrap{ position:relative; width:min(66vw,300px); height:min(66vw,300px); }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-bg{ fill:none; stroke:var(--line); stroke-width:10; }
  .ring-fg{ fill:none; stroke:var(--sprint); stroke-width:10; stroke-linecap:round; transition:stroke .2s ease; }
  .ring-center{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;
    font-size:min(15vw,68px);
    font-weight:600;
  }
  .round-label{ font-size:13px; color:var(--muted); font-weight:600; }

  .config{
    display:flex; flex-direction:column; gap:14px;
    padding:0 24px; width:100%; max-width:360px; margin:0 auto;
  }
  .field{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:12px 16px;
  }
  .field label{ font-size:14px; color:var(--muted); }
  .field input{
    width:64px; text-align:right;
    background:transparent; border:none; outline:none;
    color:var(--text); font-size:20px; font-weight:600;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
    font-variant-numeric:tabular-nums;
  }

  .controls{
    display:flex; gap:12px; justify-content:center;
    padding:20px 24px 10px;
  }
  button{
    border:none; border-radius:16px;
    font-size:16px; font-weight:700;
    padding:16px 0; flex:1; max-width:220px;
    font-family:inherit; cursor:pointer;
  }
  .btn-primary{ background:var(--text); color:#0B0E11; }
  .btn-ghost{ background:var(--panel); color:var(--text); border:1px solid var(--line); }
  .btn-secondary{ background:var(--line); color:var(--text); }

  .hint{
    text-align:center; color:var(--muted); font-size:12px;
    padding:0 32px 18px; line-height:1.5;
  }
  .hidden{ display:none !important; }
</style>
</head>
<body>

  <div class="eyebrow" id="eyebrow">인터벌 타이머</div>

  <div class="stage">
    <div class="phase-label" id="phaseLabel">설정</div>
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
        <circle class="ring-fg" id="ring" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"></circle>
      </svg>
      <div class="ring-center" id="clock">00:00</div>
    </div>
    <div class="round-label" id="roundLabel">&nbsp;</div>
  </div>

  <div class="config" id="config">
    <div class="field"><label>전력질주 (초)</label><input id="cfgSprint" type="number" min="1" value="20"></div>
    <div class="field"><label>걷기/회복 (초)</label><input id="cfgWalk" type="number" min="1" value="10"></div>
    <div class="field"><label>라운드 수</label><input id="cfgRounds" type="number" min="1" value="8"></div>
    <div class="field"><label>시작 카운트다운 (초)</label><input id="cfgCountdown" type="number" min="0" value="5"></div>
  </div>

  <div class="controls" id="controlsIdle">
    <button class="btn-primary" id="btnStart">시작</button>
  </div>
  <div class="controls hidden" id="controlsRun">
    <button class="btn-ghost" id="btnPause">일시정지</button>
    <button class="btn-secondary" id="btnReset">종료</button>
  </div>

  <div class="hint">화면을 꺼도 소리는 계속 재생됩니다. Safari 공유 버튼 → “홈 화면에 추가”로 저장하면 앱처럼 쓸 수 있습니다.</div>

<script>
(function(){
  const els = {
    eyebrow: document.getElementById('eyebrow'),
    phaseLabel: document.getElementById('phaseLabel'),
    ring: document.getElementById('ring'),
    clock: document.getElementById('clock'),
    roundLabel: document.getElementById('roundLabel'),
    config: document.getElementById('config'),
    controlsIdle: document.getElementById('controlsIdle'),
    controlsRun: document.getElementById('controlsRun'),
    btnStart: document.getElementById('btnStart'),
    btnPause: document.getElementById('btnPause'),
    btnReset: document.getElementById('btnReset'),
    cfgSprint: document.getElementById('cfgSprint'),
    cfgWalk: document.getElementById('cfgWalk'),
    cfgRounds: document.getElementById('cfgRounds'),
    cfgCountdown: document.getElementById('cfgCountdown'),
  };

  const RING_CIRC = 2 * Math.PI * 52;
  const COLORS = { ready:'#5B7A99', sprint:'#FF5A36', walk:'#33D6A6', done:'#FFD166' };
  const PHASE_TEXT = { ready:'준비', sprint:'전력질주', walk:'걷기 / 회복', done:'완료' };

  let audioCtx = null, playBuffer = null, sourceNode = null;
  let plan = null, isPlaying = false, pausedAt = 0, playStartCtxTime = 0, rafId = null;

  function readConfig(){
    return {
      sprint: Math.max(1, parseInt(els.cfgSprint.value,10) || 20),
      walk: Math.max(1, parseInt(els.cfgWalk.value,10) || 10),
      rounds: Math.max(1, parseInt(els.cfgRounds.value,10) || 8),
      countdown: Math.max(0, parseInt(els.cfgCountdown.value,10) || 0),
    };
  }

  function buildPlan(cfg){
    const segments = [];
    let t = 0;
    segments.push({start:0, end:cfg.countdown, phase:'ready', round:0});
    t = cfg.countdown;
    for(let r=1; r<=cfg.rounds; r++){
      segments.push({start:t, end:t+cfg.sprint, phase:'sprint', round:r});
      t += cfg.sprint;
      segments.push({start:t, end:t+cfg.walk, phase:'walk', round:r});
      t += cfg.walk;
    }
    segments.push({start:t, end:t+1.2, phase:'done', round:cfg.rounds});
    const total = t;

    const beeps = [];
    const tickCount = Math.min(3, cfg.countdown);
    for(let i=tickCount; i>=1; i--) beeps.push({t: cfg.countdown - i, type:'tick'});
    segments.forEach(seg=>{
      if(seg.phase==='sprint') beeps.push({t:seg.start, type:'sprint_start'});
      if(seg.phase==='walk') beeps.push({t:seg.start, type:'walk_start'});
      if(seg.phase==='done') beeps.push({t:seg.start, type:'done'});
    });
    return {segments, beeps, total, rounds:cfg.rounds};
  }

  async function renderTrack(p){
    const sampleRate = 44100;
    const totalSeconds = p.total + 1.5;
    const ctx = new OfflineAudioContext(1, Math.ceil(totalSeconds*sampleRate), sampleRate);
    function beep(time, freq, dur, gainVal){
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(gainVal, time+0.01);
      g.gain.linearRampToValueAtTime(0, time+dur);
      osc.connect(g).connect(ctx.destination);
      osc.start(time);
      osc.stop(time+dur+0.02);
    }
    p.beeps.forEach(e=>{
      if(e.type==='tick') beep(e.t, 660, 0.08, 0.45);
      else if(e.type==='sprint_start'){ beep(e.t,880,0.12,0.9); beep(e.t+0.16,880,0.12,0.9); }
      else if(e.type==='walk_start'){ beep(e.t,440,0.22,0.8); }
      else if(e.type==='done'){ beep(e.t,523,0.15,0.9); beep(e.t+0.18,659,0.15,0.9); beep(e.t+0.36,784,0.22,0.9); }
    });
    return await ctx.startRendering();
  }

  function findSegment(elapsed){
    for(const s of plan.segments){ if(elapsed>=s.start && elapsed<s.end) return s; }
    return plan.segments[plan.segments.length-1];
  }

  function setBg(phase){ document.body.style.backgroundColor = phase==='ready' ? '#0B0E11' : '#0B0E11'; }

  function updateUI(elapsed){
    const seg = findSegment(elapsed);
    const remain = Math.max(0, Math.ceil(seg.end - elapsed));
    const mm = String(Math.floor(remain/60)).padStart(2,'0');
    const ss = String(remain%60).padStart(2,'0');
    els.clock.textContent = mm+':'+ss;
    els.phaseLabel.textContent = PHASE_TEXT[seg.phase];
    els.phaseLabel.style.color = COLORS[seg.phase];
    els.ring.style.stroke = COLORS[seg.phase];
    els.roundLabel.textContent = seg.phase==='ready' ? '곧 시작합니다' :
      seg.phase==='done' ? '수고하셨습니다' : `${seg.round} / ${plan.rounds}`;

    const segDur = Math.max(0.001, seg.end - seg.start);
    const progress = Math.min(1, Math.max(0, (elapsed - seg.start)/segDur));
    els.ring.setAttribute('stroke-dasharray', RING_CIRC);
    els.ring.setAttribute('stroke-dashoffset', RING_CIRC * (1-progress));
  }

  function getElapsed(){
    if(!isPlaying) return pausedAt;
    return pausedAt + (audioCtx.currentTime - playStartCtxTime);
  }

  function tick(){
    const elapsed = getElapsed();
    updateUI(elapsed);
    if(isPlaying) rafId = requestAnimationFrame(tick);
  }

  function startPlaybackFrom(offset){
    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = playBuffer;
    sourceNode.connect(audioCtx.destination);
    sourceNode.onended = handleEnded;
    playStartCtxTime = audioCtx.currentTime;
    sourceNode.start(0, offset);
    pausedAt = offset;
    isPlaying = true;
    tick();
  }

  function handleEnded(){
    isPlaying = false;
    cancelAnimationFrame(rafId);
    updateUI(plan.total + 1);
    els.controlsRun.classList.add('hidden');
    els.controlsIdle.classList.remove('hidden');
    els.config.classList.remove('hidden');
  }

  els.btnStart.addEventListener('click', async ()=>{
    const cfg = readConfig();
    plan = buildPlan(cfg);
    els.phaseLabel.textContent = '준비 중...';
    els.config.classList.add('hidden');
    els.controlsIdle.classList.add('hidden');
    playBuffer = await renderTrack(plan);
    if(audioCtx){ try{ await audioCtx.close(); }catch(e){} }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    startPlaybackFrom(0);
    els.controlsRun.classList.remove('hidden');
    els.btnPause.textContent = '일시정지';
  });

  els.btnPause.addEventListener('click', ()=>{
    if(isPlaying){
      const elapsed = getElapsed();
      sourceNode.onended = null;
      try{ sourceNode.stop(); }catch(e){}
      pausedAt = elapsed;
      isPlaying = false;
      cancelAnimationFrame(rafId);
      els.btnPause.textContent = '이어서';
    } else {
      audioCtx.resume().catch(()=>{});
      startPlaybackFrom(pausedAt);
      els.btnPause.textContent = '일시정지';
    }
  });

  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && isPlaying && audioCtx && audioCtx.state!=='closed'){
      audioCtx.resume().catch(()=>{});
    }
  });

  els.btnReset.addEventListener('click', ()=>{
    if(sourceNode){ sourceNode.onended = null; try{ sourceNode.stop(); }catch(e){} }
    isPlaying = false;
    pausedAt = 0;
    cancelAnimationFrame(rafId);
    els.phaseLabel.textContent = '설정';
    els.phaseLabel.style.color = '';
    els.roundLabel.textContent = '\u00A0';
    els.clock.textContent = '00:00';
    els.ring.setAttribute('stroke-dashoffset', RING_CIRC);
    els.controlsRun.classList.add('hidden');
    els.controlsIdle.classList.remove('hidden');
    els.config.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
